# Workouts production -> test DB sync. All operations require manual jobs.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - preflight
  - backup

variables:
  PROD_HOST: "2.29.51.66"
  PROD_DB: "workouts"
  TEST_HOST: "192.168.1.37"
  TEST_DB: "workouts_test"
  STAGING_DB: "workouts_restore_staging"

preflight:
  stage: preflight
  image: alpine:3.20
  rules:
    - when: manual
      allow_failure: false
  script:
    - sh scripts/preflight.sh

# Streams a custom-format backup and validates its archive index.
# It does not publish production data as a GitLab job artifact.
verify_production_backup:
  stage: backup
  image: postgres:17-alpine
  needs: []
  resource_group: workouts-production-backup
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
  before_script:
    - apk add --no-cache openssh-client
  script:
    - sh scripts/verify-production-backup.sh
