# Workouts production -> test DB sync. Push or web on main creates a pipeline.
# Push pipelines require approval before restoring production data to test.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never

# Stages group related work; same-stage needs preserve the required order.
stages:
  - validate
  - setup
  - backup
  - sync
  - verify

# Set PROD_HOST, TEST_HOST, TEST_DB_HOST in protected GitLab CI/CD Variables.
# DB names are checked against config/sync.yml. Values below are public policy,
# not physical endpoints; keep any changes consistent with config/sync.yml.
variables:
  PROD_DB: "workouts"
  TEST_DB: "workouts_test"
  STAGING_DB: "workouts_restore_staging"

# Validate repository and Python logic before any host changes.
validate_repository:
  stage: validate
  image: python:3.12-slim
  rules: &main_auto_rules
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never
  before_script:
    - pip install --no-cache-dir 'PyYAML==6.0.2'
  script:
    - bash scripts/tests/static-checks.sh

# Dedicated disposable PostgreSQL: no production/test credentials or host access.
postgresql_integration:
  stage: validate
  image: postgres:17-alpine
  services:
    - name: postgres:17-alpine
      alias: ephemeral-postgres
  variables:
    POSTGRES_PASSWORD: "ci_ephemeral_only"
    POSTGRES_DB: "sync_integration"
    PGHOST: "ephemeral-postgres"
    PGPORT: "5432"
    PGUSER: "postgres"
    PGPASSWORD: "ci_ephemeral_only"
    PGDATABASE: "sync_integration"
    WORKOUTS_EPHEMERAL_PG: "1"
  rules: *main_auto_rules
  before_script:
    - apk add --no-cache python3
    - until pg_isready -h "$PGHOST" -U "$PGUSER"; do sleep 1; done
  script:
    - python3 -m unittest discover -s tests -p 'postgres_integration.py' -v

# Provision the existing PostgreSQL 17 test host before any data flows.
# Preflight has already validated CI inputs before this job changes the test host.
ansible_bootstrap:
  stage: setup
  image: python:3.12-slim
  resource_group: workouts-production-to-test-ssh
  rules: *main_auto_rules
  before_script: &ansible_ssh_setup
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client >/dev/null
    - pip install --no-cache-dir 'ansible-core==2.19.4'
  script:
    - python3 scripts/ansible_run.py bootstrap

preflight:
  stage: validate
  needs: [validate_repository, postgresql_integration]
  image: python:3.12-slim
  rules: *main_auto_rules
  before_script:
    - pip install --no-cache-dir 'ansible-core==2.19.4'
  script:
    - python3 scripts/ansible_run.py preflight

# Streams a custom-format backup and validates its archive index.
# It does not publish production data as a GitLab job artifact.
verify_production_backup:
  stage: backup
  image: postgres:17-alpine
  resource_group: workouts-production-backup
  rules: *main_auto_rules
  before_script: &ssh_setup
    - apk add --no-cache openssh-client python3
  script:
    - python3 scripts/db_sync.py verify-production

# Read-only test database backup, verified in the job and then deleted.
# No database dump is stored as a GitLab artifact.
backup_test_database:
  stage: backup
  needs: [verify_production_backup]
  image: postgres:17-alpine
  resource_group: workouts-test-backup
  rules: *main_auto_rules
  before_script:
    - apk add --no-cache python3
  script:
    - python3 scripts/db_sync.py backup-test

# Proves the restricted test SSH receiver accepts a streamed production dump.
# The receiver validates the archive and deletes it; no database is restored.
verify_test_restore_ssh:
  stage: backup
  needs: [backup_test_database]
  image: postgres:17-alpine
  resource_group: workouts-production-to-test-ssh
  rules: *main_auto_rules
  before_script: *ssh_setup
  script:
    - python3 scripts/db_sync.py verify-transport

# Before every restore, remove orphaned routines/sequences left by an older
# candidate cleanup. Refuses to destroy a candidate containing business tables.
prepare_candidate:
  stage: sync
  image: alpine:3.20
  resource_group: workouts-production-to-test-ssh
  rules: *main_auto_rules
  before_script: *ssh_setup
  script:
    - python3 scripts/db_sync.py prepare-candidate

# Restricted production restore to an EMPTY workouts_restore_candidate ONLY.
# A successful test sync clears the candidate for the next pipeline.
# No artifacts, no direct writes to workouts_test or workouts_restore_staging.
restore_production_to_candidate:
  stage: sync
  needs: [prepare_candidate]
  image: postgres:17-alpine
  resource_group: workouts-production-to-test-ssh
  rules:
    # A code push must never start a production-data refresh without approval.
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: false
    # An explicitly started web pipeline runs all stages in order.
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'
      when: on_success
    - when: never
  before_script: *ssh_setup
  script:
    - python3 scripts/db_sync.py restore-candidate

# Test data refresh from the candidate restored by the preceding stage.
# The server takes a durable backup, pauses ONLY the test API and performs
# a single-transaction data copy preserving Liquibase and test-only records.
# After a successful sync the server removes candidate data (keeps dblink).
sync_candidate_to_test:
  stage: sync
  needs: [restore_production_to_candidate]
  image: alpine:3.20
  resource_group: workouts-production-to-test-ssh
  rules: *main_auto_rules
  before_script: *ssh_setup
  script:
    - python3 scripts/db_sync.py sync-test

# Independent, read-only verification that cleanup and test restart succeeded.
verify_sync_result:
  stage: verify
  image: python:3.12-slim
  resource_group: workouts-production-to-test-ssh
  rules: *main_auto_rules
  before_script: *ansible_ssh_setup
  script:
    - python3 scripts/ansible_run.py verify
