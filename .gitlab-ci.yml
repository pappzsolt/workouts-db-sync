# Workouts production -> test DB sync. Push or web on main creates a pipeline.
# Push and web pipelines run the full sync automatically after validation.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never

# Validation can run concurrently; refresh holds one lock until its child finishes.
stages: [validate, sync]

# Set PROD_HOST, TEST_HOST, TEST_DB_HOST in protected GitLab CI/CD Variables.
# DB names are checked against config/sync.yml. Values below are public policy,
# not physical endpoints; keep any changes consistent with config/sync.yml.
variables:
  PROD_DB: "workouts"
  TEST_DB: "workouts_test"
  STAGING_DB: "workouts_restore_staging"

# Validate repository and Python logic before any host changes.
validate_repository:
  stage: validate
  image: python:3.12-slim
  rules: &main_auto_rules
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never
  before_script:
    - python3 -m pip install --no-cache-dir -r requirements-test.txt
  script:
    - bash scripts/tests/static-checks.sh

# Dedicated disposable PostgreSQL: no production/test credentials or host access.
postgresql_integration:
  stage: validate
  image: postgres:17-alpine
  services:
    - name: postgres:17-alpine
      alias: ephemeral-postgres
  variables:
    POSTGRES_PASSWORD: "ci_ephemeral_only"
    POSTGRES_DB: "sync_integration"
    PGHOST: "ephemeral-postgres"
    PGPORT: "5432"
    PGUSER: "postgres"
    PGPASSWORD: "ci_ephemeral_only"
    PGDATABASE: "sync_integration"
    WORKOUTS_EPHEMERAL_PG: "1"
  rules: *main_auto_rules
  before_script:
    - apk add --no-cache python3
    - until pg_isready -h "$PGHOST" -U "$PGUSER"; do sleep 1; done
  script:
    - python3 -m unittest discover -s tests -p 'postgres_integration.py' -v

preflight:
  stage: validate
  needs: [validate_repository, postgresql_integration]
  image: python:3.12-slim
  rules: *main_auto_rules
  before_script:
    - pip install --no-cache-dir 'ansible-core==2.19.4'
  script:
    - python3 scripts/ansible_run.py preflight

# Retain the resource until all child pipeline jobs finish.
refresh_test_database:
  stage: sync
  resource_group: workouts-refresh-pipeline
  rules: *main_auto_rules
  trigger:
    include:
      - local: ci/sync.yml
    strategy: depend
    forward:
      yaml_variables: true
      pipeline_variables: true
