---
- name: Bootstrap restricted Workouts test database sync on budsh
  hosts: workouts_test
  gather_facts: false
  become: true
  vars_files:
    - ../config/sync.yml
    - vars/postgresql.yml
  vars:
    base: "{{ sync_server_base }}"
    restore_home: "{{ sync_receiver_home }}"
    pg_bin: "{{ sync_pg_bin }}"
    pg_hba: "{{ sync_pg_hba }}"
    pg_ident: "{{ sync_pg_ident }}"
    restore_pubkey: "{{ lookup('env','WORKOUTS_RESTORE_PUBKEY') }}"
    ansible_become_password: "{{ lookup('env','ANSIBLE_BECOME_PASSWORD') }}"
  tasks:
    - name: Configure prerequisites
      ansible.builtin.import_tasks: tasks/bootstrap/prerequisites.yml

    - name: Configure receiver
      ansible.builtin.import_tasks: tasks/bootstrap/receiver.yml

    - name: Configure postgresql
      ansible.builtin.import_tasks: tasks/bootstrap/postgresql.yml

    - name: Configure verify installation
      ansible.builtin.import_tasks: tasks/bootstrap/verify-installation.yml
  handlers:
    - name: Reload PostgreSQL
      ansible.builtin.command:
        argv: >-
          {{ pg_admin_argv + ["-d", "postgres", "-c", "SELECT pg_reload_conf()"] }}
      become_user: root
      changed_when: true
