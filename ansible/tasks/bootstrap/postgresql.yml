---
# SSH is pappzs; become root via sudo, then use runuser for local peer auth.
# Avoid Ansible temp-file ACL issues when becoming a second unprivileged user.
- name: Query existing PostgreSQL loader role
  ansible.builtin.command:
    argv: >-
      {{ pg_admin_argv + ["-At", "-d", "postgres", "-c", "SELECT count(*) FROM pg_roles WHERE rolname='" ~ sync_loader_role ~ "'"] }}
  register: restore_loader_exists
  changed_when: false

- name: Create restricted loader role only when missing
  ansible.builtin.command:
    argv: >-
      {{ pg_admin_argv + ["-d", "postgres", "-c", "CREATE ROLE " ~ sync_loader_role ~ " LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION"] }}
  when: restore_loader_exists.stdout | trim == '0'

- name: Assert existing loader cannot administer other databases
  ansible.builtin.command:
    argv: >-
      {{ pg_admin_argv + ["-At", "-d", "postgres", "-c", "SELECT NOT (rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls) FROM pg_roles WHERE rolname='" ~ sync_loader_role ~ "'"] }}
  register: loader_restricted
  changed_when: false
  failed_when: loader_restricted.rc != 0 or loader_restricted.stdout | trim != 't'

- name: Check candidate database existence
  ansible.builtin.command:
    argv: >-
      {{ pg_admin_argv + ["-A", "-t", "-d", "postgres", "-c", "SELECT count(*) FROM pg_database WHERE datname='" ~ sync_candidate_db ~ "'"] }}
  become_user: root
  register: candidate_exists
  changed_when: false

- name: Create candidate owned by restricted loader on first bootstrap
  ansible.builtin.command:
    argv: ["runuser", "-u", "{{ sync_pg_admin_user }}", "--", "{{ pg_bin }}/createdb", "-h", "{{ sync_pg_socket }}", "-p", "{{ sync_pg_port | string }}", "-O", "{{ sync_loader_role }}", "{{ sync_candidate_db }}"]
  become_user: root
  when: candidate_exists.stdout | trim == '0'

- name: Read current candidate database owner
  ansible.builtin.command:
    argv: >-
      {{ pg_admin_argv + ["-At", "-d", "postgres", "-c", "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname='" ~ sync_candidate_db ~ "'"] }}
  register: candidate_owner
  changed_when: false
  failed_when: candidate_owner.rc != 0 or candidate_owner.stdout | trim == ''

- name: Set candidate owner only if needed
  ansible.builtin.command:
    argv: >-
      {{ pg_admin_argv + ["-d", "postgres", "-c", "ALTER DATABASE " ~ sync_candidate_db ~ " OWNER TO " ~ sync_loader_role] }}
  when: candidate_owner.stdout | trim != sync_loader_role

- name: Permit only mapped receiver to log in as restore loader (highest HBA priority)
  ansible.builtin.blockinfile:
    path: "{{ pg_hba }}"
    insertbefore: BOF
    backup: true
    marker: '# {mark} WORKOUTS-DB-SYNC MANAGED'
    block: |
      local   {{ sync_candidate_db }} {{ sync_loader_role }} peer map=workouts_restore_map
      local   all                        {{ sync_loader_role }} reject
      host    all                        {{ sync_loader_role }} 0.0.0.0/0 reject
      host    all                        {{ sync_loader_role }} ::/0 reject
  notify: Reload PostgreSQL

- name: Map receiver OS account to the dedicated database role
  ansible.builtin.blockinfile:
    path: "{{ pg_ident }}"
    create: false
    marker: '# {mark} WORKOUTS-DB-SYNC MANAGED'
    block: |
      workouts_restore_map {{ sync_receiver_user }} {{ sync_loader_role }}
  notify: Reload PostgreSQL

- name: Apply PostgreSQL access configuration before testing and bootstrap
  ansible.builtin.meta: flush_handlers

- name: Ensure dblink is installed in candidate by PostgreSQL administrator
  ansible.builtin.command:
    argv: >-
      {{ pg_admin_argv + ["-d", sync_candidate_db, "-c", "CREATE EXTENSION IF NOT EXISTS dblink WITH SCHEMA public"] }}
  become_user: root
  changed_when: false

- name: Validate restricted candidate connection as actual receiver OS user
  ansible.builtin.command:
    argv: ["runuser", "-u", "{{ sync_receiver_user }}", "--", "{{ pg_bin }}/psql", "-h", "{{ sync_pg_socket }}", "-p", "{{ sync_pg_port | string }}", "-X", "-A", "-t", "-v", "ON_ERROR_STOP=1", "-U", "{{ sync_loader_role }}", "-d", "{{ sync_candidate_db }}", "-c", "SELECT current_user"]
  become_user: root
  register: candidate_login
  changed_when: false
  failed_when: candidate_login.rc != 0 or candidate_login.stdout | trim != sync_loader_role


- name: Maintain test backup read access for existing tables and their creating owners
  ansible.builtin.command:
    argv: >-
      {{ pg_admin_argv + ["-1", "-d", sync_test_db, "-v", "backup_role=" ~ sync_backup_role, "-f", base ~ "/sql/backup-permissions.sql"] }}
  changed_when: false
