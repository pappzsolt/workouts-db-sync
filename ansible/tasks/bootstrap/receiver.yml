---
- name: Create dedicated OS SSH receiver (without shell access over authorized key)
  ansible.builtin.user:
    name: "{{ sync_receiver_user }}"
    home: "{{ restore_home }}"
    shell: /bin/bash
    create_home: true
    system: false

- name: Lock down receiver home
  ansible.builtin.file:
    path: "{{ restore_home }}"
    owner: "{{ sync_receiver_user }}"
    group: "{{ sync_receiver_user }}"
    mode: '0750'

- name: Create restricted receiver directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ base }}", owner: root, group: root, mode: '0755'}
    - {path: "{{ restore_home }}/.ssh", owner: "{{ sync_receiver_user }}", group: "{{ sync_receiver_user }}", mode: '0700'}
    - {path: "{{ restore_home }}/incoming", owner: "{{ sync_receiver_user }}", group: "{{ sync_receiver_user }}", mode: '0700'}

- name: Copy only audited root-owned fixed-purpose entrypoints
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/server/{{ item }}"
    dest: "{{ base }}/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  loop:
    - reset-candidate.sh
    - common.sh
    - receive-backup.sh
    - restore-dispatch.sh
    - receive-restore-candidate.sh
    - prepare-candidate.sh
    - sync-test.sh

- name: Create shared candidate and test maintenance lock
  ansible.builtin.file:
    path: "{{ sync_lock }}"
    state: touch
    owner: root
    group: root
    mode: '0644'
    access_time: preserve
    modification_time: preserve

- name: Recreate maintenance lock after reboot
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/workouts-db-sync.conf
    content: |
      f {{ sync_lock }} 0644 root root -
    owner: root
    group: root
    mode: '0644'

- name: Create root-owned read-only SQL directory
  ansible.builtin.file:
    path: "{{ base }}/sql"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install version-controlled fixed-purpose SQL
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ base }}/sql/{{ item | basename }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ query('fileglob', playbook_dir ~ '/../sql/*.sql') }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Fix receiver key to forced dispatcher, no ports or PTY
  ansible.builtin.copy:
    dest: "{{ restore_home }}/.ssh/authorized_keys"
    content: |
      restrict,command="{{ base }}/restore-dispatch.sh" {{ restore_pubkey }}
    owner: "{{ sync_receiver_user }}"
    group: "{{ sync_receiver_user }}"
    mode: '0600'
  no_log: true

- name: Limit passwordless sudo to two immutable server-side programs
  ansible.builtin.copy:
    dest: /etc/sudoers.d/workouts-db-sync-test
    content: |
      {{ sync_receiver_user }} ALL=(root) NOPASSWD: {{ base }}/sync-test.sh, {{ base }}/prepare-candidate.sh
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'


- name: Install immutable runtime policy from the shared configuration
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/server-config.sh.j2"
    dest: "{{ base }}/server-config.sh"
    owner: root
    group: root
    mode: '0644'
    validate: '/bin/bash -n %s'
