---
- name: Validate controlled sync configuration and connectivity without changing servers
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../config/sync.yml
  vars:
    ci_project: "{{ lookup('env', 'CI_PROJECT_PATH') }}"
    ci_branch: "{{ lookup('env', 'CI_COMMIT_BRANCH') }}"
    prod_host: "{{ lookup('env', 'PROD_HOST') }}"
    test_host: "{{ lookup('env', 'TEST_HOST') }}"
  tasks:
    - name: Verify project, branch, database names and independent endpoints
      ansible.builtin.assert:
        that:
          - ci_project == sync_project
          - ci_branch == sync_branch
          - prod_host | length > 0
          - test_host | length > 0
          - prod_host != test_host
          - lookup('env', 'PROD_DB') == sync_production_db
          - lookup('env', 'TEST_DB') == sync_test_db
          - lookup('env', 'STAGING_DB') == sync_staging_db
          - sync_production_db != sync_test_db
          - sync_candidate_db not in [sync_production_db, sync_test_db, sync_staging_db]
        fail_msg: 'Project, database policy, or non-secret endpoint configuration mismatch.'

    - name: Verify generated inventory matches the configured two endpoints
      ansible.builtin.assert:
        that:
          - groups['workouts_production'] | default([]) | length == 1
          - groups['workouts_test'] | default([]) | length == 1
          - hostvars[groups['workouts_production'][0]].ansible_host == prod_host
          - hostvars[groups['workouts_test'][0]].ansible_host == test_host
        fail_msg: 'Dynamic inventory is missing or points to unexpected endpoints.'

    - name: Check SSH TCP reachability without logging into production
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 22
        connect_timeout: 5
        timeout: 20
        state: started
      loop: "{{ groups['workouts_production'] + groups['workouts_test'] }}"
