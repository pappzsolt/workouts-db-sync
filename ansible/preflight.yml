---
- name: Validate CI-provided endpoints, database policy and connectivity without changing servers
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../config/sync.yml
  vars:
    ci_project: "{{ lookup('env', 'CI_PROJECT_PATH') }}"
    ci_branch: "{{ lookup('env', 'CI_COMMIT_BRANCH') }}"
    prod_host: "{{ lookup('env', 'PROD_HOST') | trim }}"
    test_host: "{{ lookup('env', 'TEST_HOST') | trim }}"
    database_policy:
      PROD_DB: "{{ sync_production_db }}"
      TEST_DB: "{{ sync_test_db }}"
      STAGING_DB: "{{ sync_staging_db }}"
    endpoints:
      - {group: workouts_production, host: "{{ prod_host }}"}
      - {group: workouts_test, host: "{{ test_host }}"}
    database_targets:
      - "{{ sync_production_db }}"
      - "{{ sync_test_db }}"
      - "{{ sync_staging_db }}"
      - "{{ sync_candidate_db }}"
  tasks:
    - name: Verify project, branch and independent targets
      ansible.builtin.assert:
        that:
          - ci_project == sync_project
          - ci_branch == sync_branch
          - prod_host | length > 0
          - test_host | length > 0
          - prod_host != test_host
          - database_targets | unique | length == database_targets | length
        fail_msg: 'Project, database policy, or non-secret endpoint configuration mismatch.'
      tags: [policy]

    - name: Verify database variables match repository policy
      ansible.builtin.assert:
        that:
          - lookup('env', item.key) == item.value
        fail_msg: "{{ item.key }} does not match the database policy."
      loop: "{{ database_policy | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      tags: [policy]

    - name: Verify generated inventory matches the configured two endpoints
      ansible.builtin.assert:
        that:
          - groups[item.group] | default([]) | length == 1
          - hostvars[groups[item.group][0]].ansible_host == item.host
        fail_msg: 'Dynamic inventory is missing or points to unexpected endpoints.'
      loop: "{{ endpoints }}"
      loop_control:
        label: "{{ item.group }}"
      tags: [policy]

    - name: Check SSH TCP reachability without logging into production
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 22
        connect_timeout: 5
        timeout: 20
        state: started
      loop: "{{ groups['workouts_production'] + groups['workouts_test'] }}"
      tags: [connectivity]
