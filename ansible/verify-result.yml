---
- name: Verify completed test database sync without modifying state
  hosts: workouts_test
  gather_facts: false
  become: true
  vars:
    pg_bin: /usr/lib/postgresql/17/bin
    ansible_become_password: "{{ lookup('env','ANSIBLE_BECOME_PASSWORD') }}"
  tasks:
    - name: Read candidate cleanup state in one database round trip
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - "{{ pg_bin }}/psql"
          - -XAt
          - -v
          - ON_ERROR_STOP=1
          - -d
          - workouts_restore_candidate
          - -c
          - |
            SELECT
              (SELECT count(*) FROM pg_class c
               JOIN pg_namespace n ON n.oid=c.relnamespace
               WHERE n.nspname='public' AND c.relkind IN ('r','p','v','m','S','f')
                 AND NOT EXISTS (
                   SELECT 1 FROM pg_depend d
                   WHERE d.classid='pg_class'::regclass AND d.objid=c.oid AND d.deptype='e')),
              (SELECT count(*) FROM pg_proc p
               JOIN pg_namespace n ON n.oid=p.pronamespace
               WHERE n.nspname='public'
                 AND NOT EXISTS (
                   SELECT 1 FROM pg_depend d
                   WHERE d.classid='pg_proc'::regclass AND d.objid=p.oid AND d.deptype='e')),
              (SELECT count(*) FROM pg_extension WHERE extname='dblink');
      register: candidate_state
      changed_when: false

    - name: Check test business and Liquibase records
      ansible.builtin.command:
        argv: [runuser, -u, postgres, --, "{{ pg_bin }}/psql", -XAt, -v, ON_ERROR_STOP=1, -d, workouts_test, -c, "SELECT (SELECT count(*) FROM public.users), (SELECT count(*) FROM public.workouts), (SELECT count(*) FROM public.exercises), (SELECT count(*) FROM public.databasechangelog)"]
      register: test_counts
      changed_when: false

    - name: Check test API Docker state
      ansible.builtin.command:
        argv: [docker, inspect, -f, "{{ '{{.State.Running}}' }}", workouts-api]
      register: api_running
      changed_when: false

    - name: Fail pipeline if postconditions are not satisfied
      ansible.builtin.assert:
        that:
          - candidate_state.stdout | trim == '0|0|1'
          - test_counts.stdout.split('|') | map('int') | min > 0
          - api_running.stdout | trim == 'true'
        fail_msg: 'Candidate cleanup, test data, Liquibase or Docker API validation failed.'
        success_msg: 'Candidate clean, dblink kept, test populated, Liquibase present, API running.'
