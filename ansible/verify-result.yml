---
- name: Verify completed test database sync without modifying state
  hosts: workouts_test
  gather_facts: false
  become: true
  vars_files:
    - ../config/sync.yml
    - vars/postgresql.yml
  vars:
    pg_bin: "{{ sync_pg_bin }}"
    ansible_become_password: "{{ lookup('env','ANSIBLE_BECOME_PASSWORD') }}"
  tasks:
    - name: Read candidate cleanup state in one database round trip
      ansible.builtin.command:
        argv: >-
          {{ pg_admin_argv + ["-At", "-d", sync_candidate_db, "-f", "-"] }}
        stdin: "{{ lookup('file', playbook_dir ~ '/../sql/candidate-state.sql') }}"
      register: candidate_state
      changed_when: false

    - name: Check test business and Liquibase records
      ansible.builtin.command:
        argv: >-
          {{ pg_admin_argv + ["-At", "-d", sync_test_db, "-f", "-"] }}
        stdin: "{{ lookup('file', playbook_dir ~ '/../sql/business-counts.sql') }}"
      register: test_counts
      changed_when: false

    - name: Check test API Docker state
      ansible.builtin.command:
        argv: [docker, inspect, -f, "{{ '{{.State.Running}}' }}", "{{ sync_test_api }}"]
      register: api_running
      changed_when: false

    - name: Check optional configured HTTP health endpoint
      ansible.builtin.uri:
        url: "{{ lookup('env', 'WORKOUTS_TEST_HEALTH_URL') }}"
        method: GET
        status_code: 200
        return_content: false
        timeout: 10
      when: lookup('env', 'WORKOUTS_TEST_HEALTH_URL') | length > 0
      changed_when: false

    - name: Fail pipeline if postconditions are not satisfied
      ansible.builtin.assert:
        that:
          - candidate_state.stdout | trim == '0|0|1'
          - test_counts.stdout.split('|') | map('int') | min > 0
          - api_running.stdout | trim == 'true'
        fail_msg: 'Candidate cleanup, test data, Liquibase or Docker API validation failed.'
        success_msg: 'Candidate clean, dblink kept, test populated, Liquibase present, API running.'
